onboarding = false

[update]
version_check = false
manifest_check = false

[ui.sound]
enabled = false

[experimental]
pane_history = false

[ui]
pane_scrollbars = false
tab_bar_right = [{ type = "zoom" }, { type = "datetime", format = "%a %H:%M" }]
tab_bar_right_separator = "  "
sidebar_collapsed_mode = "hidden"
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = false

status_indicators = "symbols"
[theme]
name = "terminal"
auto_switch = false

[theme.custom]
panel_bg = "reset"
overlay0 = "#565f89"

[keys]
edit_scrollback = ""
resize_pane_left = "ctrl+alt+h"
resize_pane_down = "ctrl+alt+j"
resize_pane_up = "ctrl+alt+k"
resize_pane_right = "ctrl+alt+l"
previous_tab = "prefix+ctrl+p"
next_tab = "prefix+ctrl+n"
previous_workspace = "prefix+u"
next_workspace = "prefix+i"
next_agent = "prefix+a"
split_horizontal = "prefix+d"

[ui.toast]
delivery = "herdr"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "/home/mlue/.local/bin/herdr-sessionizer"
width = "60%"
height = "60%"

[[keys.command]]
key = "prefix+p"
type = "popup"
command = "bash"
width = "70%"
height = "60%"

[[keys.command]]
key = "prefix+m"
type = "popup"
command = "/usr/bin/lazydocker"
width = "90%"
height = "90%"
