# --- GENERAL SETTINGS ---
set -g default-terminal "${TERM}"
set -g mouse on
set -g prefix ^B
set -g base-index 1              # Start windows at 1
set -g detach-on-destroy off     # Don't exit tmux when closing a session
set -g escape-time 0             # No delay for escape key
set -g history-limit 1000000     # Huge history
set -g renumber-windows on       # Gapless window numbers
set -g set-clipboard on          # Use system clipboard
set -g status-position top

# --- QUICK RELOAD ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

# --- PLUGINS (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'vaaleyard/tmux-dotbar'

# Load Catppuccin as the color engine
set -g @plugin 'catppuccin/tmux'

# --- THEME SELECTOR ---
# Change this to: latte, frappe, macchiato, or mocha
# Dotbar will automatically follow this setting.
set -g @catppuccin_flavor 'mocha' 

# --- CATPPUCCIN CONFIG (Hidden mode) ---
set -g @catppuccin_status_enabled "no"
set -g @catppuccin_window_status_style "none"

# --- TMUX-DOTBAR DYNAMIC CONFIG ---
set -g @tmux-dotbar-position "top"
set -g @tmux-dotbar-bg "default"

# These variables use the Catppuccin theme palette dynamically:
set -g @tmux-dotbar-fg "grey"                    # Inactive windows
set -g @tmux-dotbar-fg-current "magenta"         # Active window (Mauve in Catppuccin)
set -g @tmux-dotbar-fg-session "blue"            # Session name
set -g @tmux-dotbar-fg-prefix "red"              # Prefix active color

# Formatting
set -g @tmux-dotbar-right true
set -g @tmux-dotbar-ssh-enabled true
set -g @tmux-dotbar-ssh-icon '󰌘'
set -g @tmux-dotbar-window-status-format " #W "
set -g @tmux-dotbar-window-status-current-format " #W "
set -g @tmux-dotbar-window-status-separator "•"

# --- OTHER PLUGIN CONFIG ---
set -g @sessionx-bind 'o'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# --- INITIALIZE TPM ---
run '~/.tmux/plugins/tpm/tpm'
