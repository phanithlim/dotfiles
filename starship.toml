format = """$directory$git_branch$git_status$fill$cmd_duration$time$line_break$character"""

[character]
success_symbol = "[󰄛 ❯](bold yellow)"
error_symbol = "[󰄛 ❯](bold red)"
vimcmd_symbol = "[󰄛 ❮](italic)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold blue"
read_only = " ro"

[fill]
symbol = " "
style = "dimmed"

[git_branch]
symbol = " "
style = "bold magenta"
format = "[$symbol$branch]($style) "
truncation_length = 20

[git_status]
style = "bold yellow"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
modified = "~${count}"
untracked = "?${count}"
staged = "+${count}"
deleted = "-${count}"

[cmd_duration]
min_time = 2000
style = "dimmed"
format = "[$duration]($style) "
disabled = false

[time]
disabled = false
time_format = "%H:%M"
style = "dimmed"
format = "[$time]($style)"

[python]
symbol = "py "
style = "dimmed"
format = "[$symbol$version]($style) "

[nodejs]
symbol = "node "
style = "dimmed"
format = "[$symbol$version]($style) "

[rust]
symbol = "rs "
style = "dimmed"
format = "[$symbol$version]($style) "

[package]
symbol = "pkg "
style = "dimmed"
format = "[$symbol$version]($style) "
disabled = true

[aws]
symbol = "aws "
style = "dimmed"
format = "[$symbol$profile]($style) "
disabled = true

[terraform]
symbol = "tf "
style = "dimmed"
format = "[$symbol$workspace]($style) "
disabled = true
