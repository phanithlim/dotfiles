customCommands:
  - key: '<c-a>'
    description: 'Generate AI commit message'
    context: 'files'
    loadingText: 'Claude is analyzing changes...'
    command: |
      DIFF=$(git diff --cached)
      if [ -z "$DIFF" ]; then
        echo "No staged changes found. Stage files with [Space] first."
        sleep 2
        exit 1
      fi
      COMMIT_MSG=$(echo "$DIFF" | claude -p "Write a short concise conventional commit message based on this git diff. Output ONLY the commit message, no markdown, no explanation, no backticks.")
      printf "%s" "$COMMIT_MSG" > .git/COMMIT_EDITMSG
      if [ -n "$NVIM" ]; then
        nvim --server "$NVIM" --remote-wait .git/COMMIT_EDITMSG
      else
        ${EDITOR:-nvim} .git/COMMIT_EDITMSG
      fi
      if [ -s .git/COMMIT_EDITMSG ]; then
        git commit -F .git/COMMIT_EDITMSG
      else
        echo "Commit aborted."
        sleep 1
      fi
    output: terminal
