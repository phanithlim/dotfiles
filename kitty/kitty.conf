include ~/.local/state/omarchy/current/theme/kitty.conf

# Font
# font_family  DepartureMono Nerd Font Mono
font_family JetBrainsMono Nerd Font
bold_italic_font auto
font_size 11.5
# Slightly thicker text on a dark background, so it reads sharper
text_composition_strategy 1.2 10

# Khmer (U+1780-U+17FF) + Khmer Symbols (U+19E0-U+19FF).
# JetBrainsMono has no Khmer glyphs, and fontconfig's fallback picks
# Khmer OS Muol Light (a heavy ceremonial titling face). Pin the range
# to a proper Khmer text font instead. The mapped font need not be
# monospaced -- kitty allows proportional fonts in symbol_map.
symbol_map U+1780-U+17FF,U+19E0-U+19FF Noto Sans Khmer ExtraCondensed
# Taller lines give Khmer subscripts room, so its glyphs aren't shrunk as much
modify_font cell_height 115%

# Window
# Neovim sets this to 0 while it runs (nvim/lua/config/kitty_padding.lua)
window_padding_width 6 12
hide_window_decorations yes
confirm_os_window_close 0

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# Allow remote control only over kitty's own socket (listen_on below), used by Neovim for padding
allow_remote_control socket-only

# Aesthetics
cursor_shape beam
# Smooth fade blink instead of on/off; stops after 15s idle
cursor_blink_interval 0.6 ease-in-out
cursor_stop_blinking_after 15
# IntelliJ-style caret: short quick glide on every move (works inside tmux too)
cursor_trail 1
cursor_trail_decay 0.03 0.12
cursor_trail_start_threshold 0
shell_integration no-cursor
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Allow cwd lookup from global keybindings
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}
